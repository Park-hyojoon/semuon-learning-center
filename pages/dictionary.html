<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>교재 사전 · 세무온</title>
  <meta name="theme-color" content="#155e59">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="stylesheet" href="../css/app.css?v=a4cf7ec6a016">
  <link rel="stylesheet" href="../css/dictionary.css?v=104be4b44433">
  <script defer src="../js/dictionary-income.js?v=e178b5dfe155"></script>
  <script defer src="../js/dictionary-subjects.js?v=6c89e8520089"></script>
  <script defer src="../js/dictionary.js?v=3e8f18efcf9e"></script>
</head>
<body class="semuon">
  <main class="dictionary">
    <header class="dictionary-heading">
      <img src="../assets/favicon.svg" width="40" height="40" alt="">
      <div>
        <p class="eyebrow">세무온 · 전산세무 2급</p>
        <h1>교재 사전</h1>
      </div>
    </header>
    <form class="dictionary-form" role="search" action="dictionary.html">
      <label class="sr-only" for="dictionary-subject">검색 과목</label>
      <select id="dictionary-subject" name="subject">
        <option value="">전체 과목</option>
        <option value="fa">재무회계</option>
        <option value="cost">원가회계</option>
        <option value="vat">부가가치세법</option>
        <option value="income">소득세법</option>
        <option value="practice">실무</option>
      </select>
      <label class="sr-only" for="dictionary-query">교재에서 찾을 개념이나 공식</label>
      <input id="dictionary-query" type="search" name="q" required maxlength="160" autocomplete="off" placeholder="개념이나 계산식으로 검색">
      <button class="btn" type="submit">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
        검색
      </button>
    </form>
    <nav class="dictionary-examples" aria-label="추천 검색">
      <a href="?q=감가상각비%20공식&amp;subject=fa">감가상각비 공식</a>
      <a href="?q=완성품환산량&amp;subject=cost">완성품환산량</a>
      <a href="?q=공통매입세액&amp;subject=vat">공통매입세액</a>
      <a href="?q=비과세%20소득">비과세 소득</a>
      <a href="?q=급여자료입력&amp;subject=practice">급여자료입력</a>
    </nav>
    <div id="dictionary-results"></div>
    <noscript><p>교재 사전을 사용하려면 JavaScript를 허용해 주세요.</p></noscript>
  </main>
</body>
</html>
